<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advice Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div id="adviceNumber">Advice #117</div>
        <div id="adviceText"><p>"It is easy to sit up and take notice, what's difficult is getting up and taking action."</p></div>
        <img src="pattern-divider-desktop.svg" alt="divider" class="divider">
    </div>
    <div class="dice-container">
        <button id="diceButton">
            <img src="icon-dice.svg" alt="dice" class="dice-icon">
        </button>
    </div>
    <script src="script.js"></script>
</body>
</html>
