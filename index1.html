<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfume Card</title>

    <link rel="stylesheet" href="style1.css" />
  </head>

  <body>
     <div class ="card-container">
        <div class ="product">
            <img src ="Perfume.jpg" alt ="CHANEL" class="product-image">
        </div>
        <div class="product-details">
            <h6 class ="perfume">P E R F U M E</h6>
            <h1>Chanel Eau de Cologne</h1>
            <p>Chanel Eau de Cologne is a fresh, citrusy, and elegant fragrance with light floral and musky notes, perfect for a clean, timeless scent.</p>
             <div class= "product-price">
                <h5>
                    <span class="discount-price">$219</span> 
                </h5>
                <h5 class="original-price">    $540</h5>
             </div>
            <button type ="button" class ="btn">Add to Cart
            </button>
            <input id="discount" type="number" placeholder="Enter discount %" />
            <button class ="btn">Apply Discount</button>
        </div>
     </div>
     <script src="scripts.js"></script>
</body>
</html>
