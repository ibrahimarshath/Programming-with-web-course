<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Changer Palette</title>
    <link rel="stylesheet" href="1.css">
</head>
<body>
    <div class="container">
        <h1>Color Changer Palette</h1>
        <div id="colorDisplay">Select a color</div>
        
        <div class="color-palette">
            <div class="color-box" style="background-color: #ff6b6b;" data-color="Coral Red"></div>
            <div class="color-box" style="background-color: #4ECDC4;" data-color="Turquoise"></div>
            <div class="color-box" style="background-color: #FFE66D;" data-color="Sunny Yellow"></div>
            <div class="color-box" style="background-color: #A8E6CF;" data-color="Mint Green"></div>
        </div>

        <button id="resetBtn">Reset</button>
    </div>

    <script src="1.js"></script>
</body>
</html>
