<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Cute Cats</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="card-container">
      <div class="card">
        <img src="cats.png" alt="My Cats" class="card-image" />

        <div class="card-text">
          <div class="card-header">
            <h3 class="card-title">My Cats</h3>
            <span class="card-price">Not for sale</span>
          </div>

          <p class="card-description">
            Meet my adorable trio — Dora, Bujji, and Kutty. They love naps,
            treats, and chasing toy mice all day long!
          </p>

          <button class="card-btn">Pet Them 🐾</button>
        </div>
      </div>
    </div>
  </body>
</html>
